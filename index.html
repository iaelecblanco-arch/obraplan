// --- Compresión de imágenes adjuntas (reduce tamaño antes de subir a Storage) ---
// Redimensiona a un máximo de 1600px de lado y recomprime como JPEG de calidad 0.75.
// PDFs, Word, Excel, etc. se suben tal cual, sin tocar.
const MAX_IMG_DIMENSION = 1600;
const IMG_JPEG_QUALITY = 0.75;
const compressImageFile = (file) => new Promise((resolve) => {
  const ext = file.name.split('.').pop()?.toLowerCase();
  const isCompressible = ['jpg','jpeg','png','webp'].includes(ext);
  if (!isCompressible) { resolve(null); return; } // null = no comprimir, usar el archivo original
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > MAX_IMG_DIMENSION || height > MAX_IMG_DIMENSION) {
        if (width > height) { height = Math.round(height * (MAX_IMG_DIMENSION / width)); width = MAX_IMG_DIMENSION; }
        else { width = Math.round(width * (MAX_IMG_DIMENSION / height)); height = MAX_IMG_DIMENSION; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      try {
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', IMG_JPEG_QUALITY);
      } catch(e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = ev.target.result;
  };
  reader.onerror = () => resolve(null);
  reader.readAsDataURL(file);
});

// --- Seguridad: hash de contraseñas (SHA-256 + salt del propio usuario) ---

// guarden en texto plano en Supabase. Compatible con cuentas antiguas: si el
// hash no coincide, comprueba si coincide en texto plano y migra al vuelo.
const hashPassword = async (username, plainPassword) => {
  const enc = new TextEncoder();
  const data = enc.encode(`obraplan_salt::${username.toLowerCase()}::${plainPassword}`);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
};

const getWeekNumber = (d) => { const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dayNum = date.getUTCDay() || 7; date.setUTCDate(date.getUTCDate() + 4 - dayNum); const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1)); return Math.ceil((((date - yearStart) / 86400000) + 1) / 7); };
const getMonday = (d) => { const date = new Date(d); const day = date.getDay(); const diff = date.getDate() - day + (day === 0 ? -6 : 1); return new Date(date.setDate(diff)); };

const formatDateISO = (date) => {
  if (!date) return "";
  try {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  } catch(e) { return ""; }
};

function TaskCard({ task, highlight, isAdmin, compact, draggable, selectionMode, selected, onView, onToggle, onEdit, onCopy, onDelete, onToggleStar, onDragStartTask, onDropTask, onToggleSelect }) {
  const [hover, setHover] = useState(false);
  const [tipPos, setTipPos] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const cardRef = React.useRef(null);
  const isJustifiedAbsence = task.id === 'AUSENCIA JUSTIFICADA';
  const isVacaciones = task.isAbsence && task.id === 'VACACIONES';
  const isOtherAbsence = task.isAbsence && !isVacaciones;
  const absenceTextColor = isVacaciones ? '#15803d' : isOtherAbsence ? '#92400e' : undefined;
  const bg = selected ? '#dbeafe' : highlight ? '#ccff00'
    : task.isAbsence ? 'white'
    : isJustifiedAbsence ? 'white'
    : task.completed ? '#dcfce7'
    : task.starred ? '#f3e8ff'
    : 'white';
  const border = selected ? '#2563eb' : dragOver ? '#2563eb' : highlight ? '#99cc00'
    : isVacaciones ? '#86efac' : isOtherAbsence ? '#fcd34d'
    : isJustifiedAbsence ? '#c4b5fd'
    : task.completed ? '#86efac'
    : task.starred ? '#d8b4fe'
    : '#bfdbfe';
  const textColor = isJustifiedAbsence ? '#7c3aed' : absenceTextColor;
  const handleEnter = () => {
    setHover(true);
    if (cardRef.current) {
      const r = cardRef.current.getBoundingClientRect();
      setTipPos({ top: r.top, left: r.left + r.width / 2 });
    }
  };
  const handleClick = () => { selectionMode ? onToggleSelect(task.internalId) : onView(); };
  return (
    <div ref={cardRef} onMouseEnter={handleEnter} onMouseLeave={() => { setHover(false); setDragOver(false); }} onClick={handleClick}
      draggable={draggable} onDragStart={draggable ? (e) => { e.dataTransfer.setData('text/plain', String(task.internalId)); e.dataTransfer.effectAllowed = 'move'; } : undefined}
      onDragOver={draggable ? (e) => { e.preventDefault(); setDragOver(true); } : undefined}
      onDragLeave={draggable ? () => setDragOver(false) : undefined}
      onDrop={draggable ? (e) => { e.preventDefault(); setDragOver(false); const draggedId = e.dataTransfer.getData('text/plain'); if (draggedId && draggedId !== String(task.internalId)) onDropTask(draggedId, task.internalId); } : undefined}
      className="task-card" style={{background:bg,border:`1.5px solid ${border}`,borderRadius:'6px',padding:'4px 6px',position:'relative',cursor:draggable?'grab':'pointer'}}>
      {selectionMode && (
        <div style={{position:'absolute',top:'2px',left:'2px',width:'15px',height:'15px',borderRadius:'4px',border:`2px solid ${selected?'#2563eb':'#cbd5e1'}`,background:selected?'#2563eb':'white',display:'flex',alignItems:'center',justifyContent:'center',zIndex:20}}>
          {selected && <CheckCircle2 size={11} color="white" />}
        </div>
      )}
      {!selectionMode && hover && (
        <div onClick={e => e.stopPropagation()} style={{position:'absolute',top:'2px',right:'2px',display:'flex',gap:'2px',background:'rgba(255,255,255,0.97)',borderRadius:'4px',padding:'2px',boxShadow:'0 1px 4px rgba(0,0,0,0.15)',zIndex:20}}>
          <button onClick={onToggle} style={{padding:'2px',background:'none',border:'none',cursor:'pointer',color:task.completed?'#16a34a':'#cbd5e1',display:'flex'}}><CheckCircle2 size={11} /></button>
          {!task.isAbsence && <button onClick={onToggleStar} title="Marcar como prioritaria" style={{padding:'2px',background:'none',border:'none',cursor:'pointer',color:task.starred?'#a855f7':'#cbd5e1',display:'flex'}}><Star size={11} fill={task.starred?'#a855f7':'none'} /></button>}
          {isAdmin && !task.isAbsence && <button onClick={onEdit} style={{padding:'2px',background:'none',border:'none',cursor:'pointer',color:'#94a3b8',display:'flex'}}><Pencil size={11} /></button>}
          {isAdmin && !task.isAbsence && <button onClick={onCopy} style={{padding:'2px',background:'none',border:'none',cursor:'pointer',color:'#94a3b8',display:'flex'}}><Copy size={11} /></button>}
          {isAdmin && <button onClick={onDelete} style={{padding:'2px',background:'none',border:'none',cursor:'pointer',color:'#94a3b8',display:'flex'}}><Trash2 size={11} /></button>}
        </div>
      )}
      {hover && tipPos && !task.isAbsence && (task.observations || task.instructions || task.fileCount > 0) && (
        <div style={{position:'fixed',top:tipPos.top - 8,left:tipPos.left,transform:'translate(-50%, -100%)',background:'#1e293b',color:'#e2e8f0',padding:'10px 14px',borderRadius:'10px',fontSize:'11px',fontWeight:600,lineHeight:1.4,maxWidth:'260px',minWidth:'160px',zIndex:9999,boxShadow:'0 12px 28px rgba(0,0,0,0.35)',pointerEvents:'none',whiteSpace:'normal'}}>
          {task.observations && (
            <div style={{marginBottom:(task.instructions || task.fileCount > 0) ? '6px' : 0}}>
              <div style={{fontSize:'9px',fontWeight:900,color:'#facc15',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:'2px'}}>📝 Observaciones</div>
              {task.observations}
            </div>
          )}
          {task.instructions && (
            <div style={{marginBottom:task.fileCount > 0 ? '4px' : 0,opacity:0.9}}>
              <div style={{fontSize:'9px',fontWeight:900,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:'2px'}}>📋 Instrucciones</div>
              {task.instructions.slice(0,140)}{task.instructions.length>140?'…':''}
            </div>
          )}
          {task.fileCount > 0 && <div style={{opacity:0.8,fontSize:'10px'}}>📎 {task.fileCount} archivo(s) adjunto(s)</div>}
        </div>
      )}
      <div style={{width:'100%'}}>
        <div style={{fontWeight:900,color:textColor||'#1e293b',textTransform:'uppercase',fontSize:compact?'11px':'12px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight: hover ? '52px' : '0'}}>{task.isAbsence ? task.id : `${isJustifiedAbsence ? 'AUSENCIA' : task.id} - ${task.customer}`}</div>

        {!isAdmin && !task.isAbsence && (task.instructions || task.fileCount > 0) && (
          <div style={{display:'flex',gap:'4px',marginTop:'3px',flexWrap:'wrap'}}>
            {task.instructions && <span style={{fontSize:compact?'8px':'9px',fontWeight:900,color:'#d97706',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:'4px',padding:'1px 5px',textTransform:'uppercase',letterSpacing:'0.03em'}}>📋 Instrucciones</span>}
            {task.fileCount > 0 && <span style={{fontSize:compact?'8px':'9px',fontWeight:900,color:'#7c3aed',background:'#f5f3ff',border:'1px solid #c4b5fd',borderRadius:'4px',padding:'1px 5px',textTransform:'uppercase',letterSpacing:'0.03em'}}>📎 {task.fileCount > 1 ? `${task.fileCount} docs` : 'Documento'}</span>}
          </div>
        )}
      </div>
    </div>
  );
}

function ThDay({ date, idx, isH, todayISO, tasks, techs, stickyTop, showWeekLabel, weekBoundary, hideInPrint }) {
  const dISO = formatDateISO(date);
  const isToday = dISO === todayISO;
  const dayIdx = idx % 5;
  const techsWithoutTask = techs ? techs.filter(t => !tasks.some(tk => tk.techIds.includes(t.id) && tk.date === dISO)).length : 0;
  const bg = isH ? '#fecaca' : isToday ? '#eff6ff' : (stickyTop != null ? '#f1f5f9' : 'transparent');
  return (
    <th className={hideInPrint ? 'no-print-extra-week' : undefined} style={{padding:'8px',textAlign:'center',borderRight:dayIdx<4?'1px solid #94a3b8':'none',borderLeft:weekBoundary?'3px solid #64748b':'none',background:bg,overflow:'hidden',...(stickyTop != null ? {position:'sticky',top:stickyTop,zIndex:20} : {})}}>
      {showWeekLabel && <div style={{fontSize:'8px',fontWeight:900,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'2px'}}>SEMANA {getWeekNumber(date)}</div>}
      <div style={{fontWeight:900,textTransform:'uppercase',color:isH?'#991b1b':isToday?'#2563eb':'#64748b',whiteSpace:'nowrap',fontSize:'11px',display:'flex',alignItems:'baseline',justifyContent:'center',gap:'4px'}}>
        <span>{DAYS_NAMES[dayIdx]}{isToday ? ' - HOY' : ''}</span>
        <span style={{fontSize:'15px'}}>{date.getDate()}</span>
        {techsWithoutTask > 0 && <span style={{fontSize:'10px',fontWeight:900,color:'#dc2626'}}>({techsWithoutTask})</span>}
      </div>
    </th>
  );
}

        <div onMouseEnter={() => setHovering(true)} onMouseLeave={() => setHovering(false)} style={{display:'flex',alignItems:'center',gap:'8px',position:'relative'}}>
          <div title={t.shiftType} style={{position:'absolute',top:'-4px',right:'0',width:'16px',height:'16px',borderRadius:'50%',background:shiftColor,color:'white',fontSize:'9px',fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{t.shiftType==='INTENSIVA'?'I':'N'}</div>
          <div style={{overflow:'hidden',flex:1,minWidth:0,paddingRight:'18px'}}>
            <div style={{fontWeight:900,textTransform:'uppercase',fontSize:'12px',color:'#1e293b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.name}</div>
            <div style={{fontWeight:700,color:'#475569',fontSize:'11px',textTransform:'uppercase',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.surname}</div>
          </div>
          {isAdmin && hovering && (
            <div style={{position:'absolute',top:'50%',right:0,transform:'translateY(-50%)',display:'flex',gap:'2px',background:'rgba(255,255,255,0.92)',padding:'2px',borderRadius:'6px',boxShadow:'0 1px 4px rgba(0,0,0,0.15)',border:'1px solid #e2e8f0',zIndex:1}}>
              <button onClick={() => onDuplicateNextWeek(t.id)} title="Duplicar semana a la siguiente" style={{padding:'4px',color:'#94a3b8',background:'none',border:'none',cursor:'pointer',display:'flex'}}><RefreshCw size={11} /></button>
              <button onClick={() => onCopyTechWeek(t.id)} title="Copiar semana" style={{padding:'4px',color:'#94a3b8',background:'none',border:'none',cursor:'pointer',display:'flex'}}><CopyPlus size={11} /></button>
              {techWeekClipboard && <button onClick={() => onPasteTechWeek(t.id)} title="Pegar semana" style={{padding:'4px',color:'white',background:'#2563eb',border:'none',cursor:'pointer',borderRadius:'4px',display:'flex'}}><ClipboardPaste size={11} /></button>}
            </div>
          )}
        </div>
      </td>
      {columnLayout.map((col, ci) => {
        if (col.kind === 'sep') {
          const canPasteHere = isAdmin && !!techWeekClipboard;
          const isSameTech = techWeekClipboard?.techId === t.id;
          return (
            <td key={`sep-${ci}`} className="no-print-extra-week" style={{background:'#f8fafc',borderRight:'1px solid #cbd5e1',borderLeft:'1px solid #cbd5e1',verticalAlign:'middle',padding:'2px'}}>
              {canPasteHere && (
                <button onClick={() => onPasteTechWeekAt(t.id, col.afterIdx)} title={isSameTech ? 'Pegar la semana copiada de este técnico aquí' : 'Pegar aquí la semana copiada de otro técnico'} style={{width:'100%',padding:'3px',background:isSameTech?'#16a34a':'#2563eb',border:'none',borderRadius:'5px',cursor:'pointer',color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}><ClipboardPaste size={10} color="white" /></button>
              )}
            </td>
          );
        }
        const date = col.date, idx = col.idx;
        const dISO = formatDateISO(date), isH = holidays.includes(dISO);
        const dayTasks = tasks.filter(tk => tk.techIds.includes(t.id) && tk.date === dISO);
        const hasAbsence = dayTasks.some(tk => tk.isAbsence);
        // Celda vacía = sin tareas Y (no es festivo O no hay ausencia)
        const isEmpty = dayTasks.length === 0 && !hasAbsence;
        const canCopyDay = dayTasks.length > 0;
        const canPasteDay = dayClipboard && !(dayClipboard.techId === t.id && dayClipboard.dateISO === dISO) && !hasAbsence;
        return (
          <CellHover key={idx} isH={isH} isAdmin={isAdmin} clipboard={clipboard} className={idx >= 5 ? 'no-print-extra-week' : undefined}
            onNew={() => onNewTask(t.id, date)} onPaste={() => onPasteTask(t.id, dISO)}
            canCopyDay={canCopyDay} canPasteDay={canPasteDay}
            onCopyDay={() => onCopyDay(t.id, dISO)} onPasteDay={() => onPasteDay(t.id, dISO)} selectionMode={selectionMode}>
            {isEmpty ? (
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'16px',color:'#dc2626',fontWeight:900,fontSize:'10px',textTransform:'uppercase',textAlign:'center'}}>
                <span className="animate-pulse">SIN TAREA ASIGNADA</span>
              </div>
            ) : (
              dayTasks.slice().sort((a,b) => (a.taskOrder||0) - (b.taskOrder||0)).map(task => {
                const highlight = searchTerm && (task.id.includes(searchTerm) || task.customer?.includes(searchTerm) || task.reference?.includes(searchTerm));
                const canDrag = isAdmin && !selectionMode && !task.isAbsence && dayTasks.filter(dt => !dt.isAbsence).length > 1;
                return (
                  <TaskCard key={task.internalId} task={task} highlight={highlight} isAdmin={isAdmin} compact={compact}
                    draggable={canDrag} selectionMode={selectionMode} selected={selectedIds?.has(task.internalId)}
                    onView={() => onViewTask(task)} onToggle={() => onToggleCompleted(task.internalId)} onToggleStar={() => onToggleStar(task.internalId)}
                    onEdit={() => onEditTask(task)} onCopy={() => onCopyTask(task)} onDelete={() => onDeleteTask(task.internalId, t.id)}
                    onDropTask={(draggedId, targetId) => onReorderDay(t.id, dISO, draggedId, targetId)}
                    onToggleSelect={onToggleSelect} />
                );
              })
            )}
          </CellHover>
        );
      })}
    </tr>
  );
}

function App() {
  const [user, setUser] = useState(null);

  const [selectionMode, setSelectionMode] = useState(false);

  const [bulkMoveTech, setBulkMoveTech] = useState("");
  const [bulkMoveDate, setBulkMoveDate] = useState("");
  const [techWeekClipboard, setTechWeekClipboard] = useState(null);
  const [dayClipboard, setDayClipboard] = useState(null);
  const [fullQuadrantClipboard, setFullQuadrantClipboard] = useState(null);
  const [formTaskId, setFormTaskId] = useState("");
  const [reorderList, setReorderList] = useState([]);
  const [dragIdx, setDragIdx] = useState(null);
  const [formCustomer, setFormCustomer] = useState("");
  const [formReference, setFormReference] = useState("");
  const [formObservations, setFormObservations] = useState("");
  const [formInstructions, setFormInstructions] = useState("");
  const [autoFilledFiles, setAutoFilledFiles] = useState([]);
  const [pendingFiles, setPendingFiles] = useState([]);
  const [repeatEnabled, setRepeatEnabled] = useState(false);
  const [formJustifiedAbsence, setFormJustifiedAbsence] = useState(false);
  const [formApplyToAll, setFormApplyToAll] = useState(false);
  const [formShareFiles, setFormShareFiles] = useState(false);

  const [commentsLoading, setCommentsLoading] = useState(false);

  const [auditLog, setAuditLog] = useState([]);
  const [auditLoading, setAuditLoading] = useState(false);
  const [darkMode, setDarkMode] = useState(() => localStorage.getItem('obraplan_dark') === '1');
  const [isFullscreen, setIsFullscreen] = useState(false);

  useEffect(() => {
    const handler = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', handler);
    return () => document.removeEventListener('fullscreenchange', handler);
  }, []);

  const toggleFullscreen = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  };
  const [toasts, setToasts] = useState([]);
  const [offline, setOffline] = useState(false);
  const skipNextToastRef = React.useRef(false);
  const firstLoadRef = React.useRef(true);

  const isAdmin = useMemo(() => user?.role === 'admin', [user]);
  const isMonitor = useMemo(() => user?.role === 'monitor', [user]);
  const monitorScrollRef = React.useRef(null);
  const [monitorClock, setMonitorClock] = useState(new Date());
  const [monitorTheme, setMonitorTheme] = useState('night'); // 'day' | 'night' — efectivo para esta pantalla
  const [monitorThemeDefault, setMonitorThemeDefault] = useState('night'); // preferencia global guardada por el admin
  const [monitorQuoteOverride, setMonitorQuoteOverride] = useState('');
  const [adminQuoteDraft, setAdminQuoteDraft] = useState('');
  const [monitorLoop, setMonitorLoop] = useState(false);

  // Reloj visible en la pantalla del monitor (actualización fluida cada segundo)
  useEffect(() => {
    if (!isMonitor) return;
    const iv = setInterval(() => setMonitorClock(new Date()), 1000);
    return () => clearInterval(iv);
  }, [isMonitor]);

  // El monitor siempre muestra la semana actual: revisa cada 5 min si ha cambiado
  useEffect(() => {
    if (!isMonitor) return;
    const iv = setInterval(() => {
      const realMonday = getMonday(new Date());
      setCurrentMonday(prev => formatDateISO(prev) !== formatDateISO(realMonday) ? realMonday : prev);
    }, 5 * 60000);
    return () => clearInterval(iv);
  }, [isMonitor]);

  // Refresco de datos cada 10s por si hay cambios (además del tiempo real de Supabase)
  // (se registra más abajo, después de declarar loadAll)

  // Tema día/noche: preferencia global del admin (Supabase) + posible override local de esta pantalla
  useEffect(() => {
    if (!isMonitor) return;
    (async () => {
      const { data } = await sb.from('app_settings').select('*').eq('key', 'monitor_theme').maybeSingle();
      const globalDefault = data?.value === 'day' ? 'day' : 'night';
      setMonitorThemeDefault(globalDefault);
      const override = localStorage.getItem('obraplan_monitor_theme_override');
      setMonitorTheme(override === 'day' || override === 'night' ? override : globalDefault);
    })();
  }, [isMonitor]);

  const toggleMonitorTheme = () => {
    const next = monitorTheme === 'day' ? 'night' : 'day';
    setMonitorTheme(next);
    localStorage.setItem('obraplan_monitor_theme_override', next);
  };

  // Frase motivacional: la fija el admin (se revisa cada 5 min por si la cambia)
  useEffect(() => {
    if (!isMonitor) return;
    const fetchQuote = async () => {
      const { data } = await sb.from('app_settings').select('*').eq('key', 'monitor_quote_custom').maybeSingle();
      setMonitorQuoteOverride(data?.value || '');
    };
    fetchQuote();
    const iv = setInterval(fetchQuote, 5 * 60000);
    return () => clearInterval(iv);
  }, [isMonitor]);


  // Determina si hace falta bucle de scroll (el contenido no cabe en pantalla)
  useEffect(() => {
    if (!isMonitor) return;
    const check = () => {
      const el = monitorScrollRef.current;
      if (!el) return;
      const singleHeight = monitorLoop ? el.scrollHeight / 2 : el.scrollHeight;
      const needsLoop = singleHeight > el.clientHeight + 2;
      setMonitorLoop(prev => prev !== needsLoop ? needsLoop : prev);
    };
    const t = setTimeout(check, 150);
    return () => clearTimeout(t);
  }, [isMonitor, visibleTechs, tasks, monitorTheme, monitorLoop]);

  // Auto-scroll vertical realmente continuo: las filas se duplican y al pasar la
  // altura de una "vuelta" se resta esa misma altura de golpe, con lo que el
  // salto es imperceptible (el contenido que aparece es idéntico al anterior).
  useEffect(() => {
    if (!isMonitor || !monitorLoop) return;
    const SPEED = 0.805; // 0.7 + 15%
    const iv = setInterval(() => {
      const el = monitorScrollRef.current;
      if (!el) return;
      const singleHeight = el.scrollHeight / 2;
      if (singleHeight <= 2) return;
      el.scrollTop += SPEED;
      if (el.scrollTop >= singleHeight) el.scrollTop -= singleHeight;
    }, 33);
    return () => clearInterval(iv);
  }, [isMonitor, monitorLoop]);

  const pushToast = useCallback((msg, type = 'info') => {
    const id = newId();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
  }, []);

  useEffect(() => {
    document.body.classList.toggle('dark-mode', darkMode);
    localStorage.setItem('obraplan_dark', darkMode ? '1' : '0');
  }, [darkMode]);

  const [loadTimedOut, setLoadTimedOut] = useState(false);

  const loadAll = useCallback(async (isBackground = false) => {
    if (!isBackground) { setLoading(true); setLoadTimedOut(false); }
    // Si la carga tarda más de 15s, avisamos y ofrecemos reintentar en vez de quedarnos colgados para siempre
    const withTimeout = (promise, ms) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), ms)),
    ]);
    try {
      const [{ data: td, error: e1 }, { data: ad, error: e2 }, { data: hd, error: e3 }, { data: tkd, error: e4 }] = await withTimeout(Promise.all([
        sb.from('techs').select('*').order('sort_order', { ascending: true }).order('id'),
        sb.from('admins').select('*').order('id'),
        sb.from('holidays').select('*'),
        sb.from('tasks').select('internal_id, id, customer, reference, instructions, observations, date, tech_ids, completed, is_absence, hours, task_order, starred, file_count'),
      ]), 15000);
      if (e1 || e2 || e3 || e4) throw (e1 || e2 || e3 || e4);
      const newTechs = (td || []).map(dbTechToLocal);
      const newAdmins = ad || [];
      const newHolidays = (hd || []).map(h => h.date);
      const newTasks = (tkd || []).map(dbTaskToLocal);
      setTechs(newTechs); setAdmins(newAdmins); setHolidays(newHolidays); setTasks(newTasks);
      setOffline(false);
      try { localStorage.setItem('obraplan_cache', JSON.stringify({ techs: newTechs, admins: newAdmins, holidays: newHolidays, tasks: newTasks, savedAt: Date.now() })); } catch(e) {}
    } catch(e) {
      console.error(e);
      if (e.message === 'TIMEOUT' && !isBackground) { setLoadTimedOut(true); return; }
      // Sin conexión: intentar cargar la última copia guardada localmente
      try {
        const cached = JSON.parse(localStorage.getItem('obraplan_cache') || 'null');
        if (cached) {
          setTechs(cached.techs || []); setAdmins(cached.admins || []);
          setHolidays(cached.holidays || []); setTasks(cached.tasks || []);
          setOffline(true);
        }
      } catch(e2) {}
    }
    if (!isBackground) setLoading(false);
  }, []);

  useEffect(() => {
    // Pintado instantáneo con la última caché mientras se sincroniza con Supabase
    try {
      const cached = JSON.parse(localStorage.getItem('obraplan_cache') || 'null');
      if (cached) {
        setTechs(cached.techs || []); setAdmins(cached.admins || []);
        setHolidays(cached.holidays || []); setTasks(cached.tasks || []);
        setLoading(false);
      }
    } catch(e) {}
    loadAll();
  }, [loadAll]);

  // Refresco de datos cada 10s en modo monitor por si hay cambios (además del tiempo real de Supabase)
  useEffect(() => {
    if (!isMonitor) return;
    const iv = setInterval(() => { loadAll(true); }, 10000);
    return () => clearInterval(iv);
  }, [isMonitor, loadAll]);

  // Tiempo real
  useEffect(() => {
    const notify = (msg) => { if (skipNextToastRef.current) { skipNextToastRef.current = false; return; } pushToast(msg); };
    const ch = sb.channel('obraplan-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (payload) => {
        if (payload.eventType === 'DELETE') {
          setTasks(prev => prev.filter(t => t.internalId !== payload.old.internal_id));
        } else {
          const updated = dbTaskToLocal(payload.new);
          setTasks(prev => {
            const exists = prev.some(t => t.internalId === updated.internalId);
            return exists ? prev.map(t => t.internalId === updated.internalId ? updated : t) : [...prev, updated];
          });
        }
        notify('📋 Tareas actualizadas por otro usuario');
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'techs' }, () => {
        sb.from('techs').select('*').order('sort_order', { ascending: true }).order('id').then(({ data }) => { if (data) { setTechs(data.map(dbTechToLocal)); notify('👥 Lista de técnicos actualizada'); } });
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'holidays' }, () => {
        sb.from('holidays').select('*').then(({ data }) => { if (data) { setHolidays(data.map(h => h.date)); notify('📅 Festivos actualizados'); } });
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'admins' }, () => {
        sb.from('admins').select('*').then(({ data }) => { if (data) { setAdmins(data); notify('🛡️ Administradores actualizados'); } });
      })
      .subscribe();
    return () => sb.removeChannel(ch);
  }, [pushToast]);

  const handleLogin = async (e) => {
    e.preventDefault();
    const u = e.target.username.value, p = e.target.password.value;
    const hashedInput = await hashPassword(u, p);
    const tryMatch = async (list, table) => {
      const found = list.find(a => a.username === u);
      if (!found) return null;
      if (found.password === hashedInput) return found; // ya migrado
      if (!looksHashed(found.password) && found.password === p) {
        // Cuenta antigua en texto plano: coincide -> migrar silenciosamente a hash
        await sb.from(table).update({ password: hashedInput }).eq('id', found.id);
        return { ...found, password: hashedInput };
      }
      return null;
    };
    const fa = await tryMatch(admins, 'admins');
    if (fa) { setUser(fa); setLoginError(""); return; }
    const ft = await tryMatch(techs, 'techs');
    if (ft) { setUser(ft); setLoginError(""); return; }
    setLoginError("Usuario o contraseña incorrectos");
  };

  const singleWeekDates = useMemo(() => Array.from({ length: 5 }, (_, i) => { const d = new Date(currentMonday); d.setDate(currentMonday.getDate() + i); return d; }), [currentMonday]);
  // Vista extendida: los admins pueden desplazarse lateralmente para ver 1 semana más (2 en total)
  const weekDates = useMemo(() => {
    const totalDays = isAdmin ? 10 : 5;
    return Array.from({ length: totalDays }, (_, i) => {
      const weekOffset = Math.floor(i / 5), dayOffset = i % 5;
      const d = new Date(currentMonday);
      d.setDate(currentMonday.getDate() + weekOffset * 7 + dayOffset);
      return d;
    });
  }, [currentMonday, isAdmin]);
  const weekNum = useMemo(() => getWeekNumber(currentMonday), [currentMonday]);

  const handleIdChange = (val) => {
    const upperId = val.toUpperCase().replace(/\//g, '-').slice(0, 7);
    setFormTaskId(upperId);
    const ex = tasks.find(t => t.id === upperId && !t.isAbsence);
    if (ex) {
      setFormCustomer(ex.customer);
      setFormReference(ex.reference);
      setFormInstructions(ex.instructions || '');
      setFormObservations(ex.observations || '');
      // Solo autorrellenamos archivos si es una tarea NUEVA (no al editar una ya existente)
      if (!editingTask) {
        if (ex.filesLoaded) setAutoFilledFiles(ex.files || []);
        else if (ex.fileCount > 0) fetchTaskFiles(sb, ex.internalId).then(setAutoFilledFiles);
        else setAutoFilledFiles([]);
      }
    }
  };

  const handleOpenNewTask = (techId, date) => {
    setSelectedSlot({ techId, dateISO: formatDateISO(date) }); setTempAssignedTechs([techId]);
    setEditingTask(null); setFormTaskId(""); setFormCustomer(""); setFormReference(""); setFormInstructions(""); setFormObservations(""); setAutoFilledFiles([]); setPendingFiles([]);
    setRepeatEnabled(false); setRepeatFreq('weekly'); setRepeatCount(4);
    setFormJustifiedAbsence(false); setFormHourStart(""); setFormHourEnd(""); setFormMotivo(""); setFormApplyToAll(false); setFormShareFiles(false);
    setModalMode('task');
  };

  const handleSaveTask = async (e) => {
    e.preventDefault();
    if (formJustifiedAbsence) {
      if (!formHourStart || !formMotivo.trim()) { alert('Rellena la hora de inicio y el motivo.'); return; }
      const hourInterval = formHourEnd ? `${formHourStart} a ${formHourEnd}` : formHourStart;
      setSaving(true);
      const taskData = { internalId: newId(), id: 'AUSENCIA JUSTIFICADA', customer: formMotivo.toUpperCase(), reference: hourInterval, instructions: '', observations: '', date: selectedSlot.dateISO, techIds: tempAssignedTechs, completed: false, isAbsence: false, files: [], taskOrder: 0 };
      skipNextToastRef.current = true;
      const { error } = await sb.from('tasks').insert(localTaskToDB(taskData));
      setSaving(false);
      if (error) { alert('Error al guardar: ' + error.message); return; }
      logAudit(sb, user, 'CREAR_AUSENCIA_JUSTIFICADA', `${hourInterval} - ${formMotivo}`);
      closeModal();
      return;
    }
    if (formTaskId !== 'AUSENCIA JUSTIFICADA' && !/^[A-Z0-9]+-[A-Z0-9]+$/.test(formTaskId)) {
      alert('⚠️ El ID de tarea no tiene un formato válido.\n\nMáximo 7 caracteres, con un guion. Ejemplos: A-0000 o 1234-26');
      return;
    }
    // Aviso si el ID ya existe con otro cliente/referencia (posible error de tecleo o colisión)
    if (!editingTask) {
      const mismatch = tasks.find(t => !t.isAbsence && t.id === formTaskId && (t.customer !== formCustomer || t.reference !== formReference));
      if (mismatch) {
        const proceed = window.confirm(`⚠️ El ID "${formTaskId}" ya existe con datos distintos:\n\nCliente: ${mismatch.customer}\nReferencia: ${mismatch.reference}\n\n¿Seguro que quieres guardar esta tarea con el mismo ID pero datos diferentes?`);
        if (!proceed) return;
      }
    }
    setSaving(true);
    const instructions = formInstructions;
    const taskInternalId = editingTask?.internalId || newId();
    // Start with existing files (al editar) o los autocompletados por ID (al crear), luego se añaden los nuevos
    let files;
    let uploadedNewFiles = [];
    if (editingTask) {
      files = editingTask.filesLoaded ? [...editingTask.files] : (editingTask.fileCount > 0 ? await fetchTaskFiles(sb, editingTask.internalId) : []);
    } else {
      files = [...autoFilledFiles];
    }
    if (pendingFiles.length > 0) {
      try {
        const newFileObjs = await Promise.all(pendingFiles.map(async f => {
          const compressedBlob = await compressImageFile(f);
          if (compressedBlob) {
            const jpegFile = new File([compressedBlob], f.name.replace(/\.(png|webp)$/i, '.jpg'), { type: 'image/jpeg' });
            return uploadFileToStorage(sb, jpegFile, taskInternalId);
          }
          // No es imagen comprimible (PDF, Word, etc.): subir tal cual
          return uploadFileToStorage(sb, f, taskInternalId);
        }));
        uploadedNewFiles = newFileObjs;
        files = [...files, ...newFileObjs];
      } catch (e) {
        setSaving(false);
        alert('No se pudieron subir uno o varios archivos: ' + e.message);
        return;
      }
    }
    const dayTasksForOrder = tasks.filter(t => t.techIds.includes(tempAssignedTechs[0]) && t.date === selectedSlot.dateISO && !t.isAbsence);
    const nextOrder = editingTask ? (editingTask.taskOrder ?? 0) : (dayTasksForOrder.length ? Math.max(...dayTasksForOrder.map(t => t.taskOrder || 0)) + 1 : 0);
    const taskData = { internalId: taskInternalId, id: formTaskId, customer: formCustomer, reference: formReference, instructions, observations: formObservations, date: selectedSlot.dateISO, techIds: tempAssignedTechs, completed: editingTask?.completed || false, isAbsence: false, files, taskOrder: nextOrder };
    let err = null;
    skipNextToastRef.current = true;
    if (editingTask) {
      const r = await sb.from('tasks').update(localTaskToDB(taskData)).eq('internal_id', editingTask.internalId); err = r.error;
      if (!err && formApplyToAll) {
        const oldId = editingTask.id;
        const related = tasks.filter(t => t.id === oldId && t.internalId !== editingTask.internalId && !t.isAbsence);
        if (related.length > 0) {
          const { error: e2 } = await sb.from('tasks').update({ id: formTaskId, customer: formCustomer, reference: formReference }).eq('id', oldId).neq('internal_id', editingTask.internalId);
          if (e2) alert('La tarea se guardó, pero hubo un error al renombrar el resto: ' + e2.message);
          else {
            setTasks(prev => prev.map(t => (t.id === oldId && t.internalId !== editingTask.internalId && !t.isAbsence) ? { ...t, id: formTaskId, customer: formCustomer, reference: formReference } : t));
            logAudit(sb, user, 'RENOMBRAR_TODAS', `${oldId} → ${formTaskId} (${related.length} técnicos más)`);
            pushToast(`✅ Renombrado en ${related.length + 1} tarea(s) más`);
          }
        }
      }
    } else if (repeatEnabled && repeatCount > 0) {
      // Generar ocurrencias adicionales según la frecuencia elegida
      const occurrences = [taskData];
      const baseDate = new Date(selectedSlot.dateISO + 'T12:00:00');
      for (let i = 1; i <= repeatCount; i++) {
        const d = new Date(baseDate);
        if (repeatFreq === 'weekly') d.setDate(d.getDate() + 7 * i);
        else if (repeatFreq === 'biweekly') d.setDate(d.getDate() + 14 * i);
        else if (repeatFreq === 'monthly') d.setMonth(d.getMonth() + i);
        const dISO = formatDateISO(d);
        // No crear en días donde algún técnico asignado ya tenga una ausencia
        const blocked = tempAssignedTechs.some(tid => tasks.some(x => x.techIds.includes(tid) && x.date === dISO && x.isAbsence));
        if (!blocked) occurrences.push({ ...taskData, internalId: newId() + i, date: dISO, completed: false });
      }
      const r = await sb.from('tasks').insert(occurrences.map(localTaskToDB)); err = r.error;
      if (!err) pushToast(`✅ ${occurrences.length} tareas creadas (recurrente)`);
    } else {
      const r = await sb.from('tasks').insert(localTaskToDB(taskData)); err = r.error;
    }
    setSaving(false);
    if (err) { alert('Error al guardar tarea: ' + err.message); return; }
    logAudit(sb, user, editingTask ? 'EDITAR_TAREA' : 'CREAR_TAREA', `${taskData.id} - ${taskData.customer}${repeatEnabled && !editingTask ? ' (recurrente)' : ''}`);
    // Compartir los documentos recién subidos con el resto de técnicos que tengan esta misma tarea
    if (formShareFiles && uploadedNewFiles.length > 0) {
      const related = tasks.filter(t => t.id === taskData.id && t.internalId !== taskInternalId && !t.isAbsence);
      if (related.length > 0) {

        for (const rt of related) {

          const mergedFiles = [...existingFiles, ...uploadedNewFiles];

          if (!e3) okCount++;
        }
        if (okCount > 0) {
          setTasks(prev => prev.map(t => related.some(r => r.internalId === t.internalId) ? { ...t, fileCount: (t.fileCount || 0) + uploadedNewFiles.length, filesLoaded: false } : t));
          logAudit(sb, user, 'COMPARTIR_DOCUMENTOS', `${taskData.id} → ${okCount} técnico(s) más`);
          pushToast(`📎 Documentos compartidos con ${okCount} técnico${okCount!==1?'s':''} más`);

    const scrollDiv = document.querySelector('.desktop-table');
    if (!cardEl || !scrollDiv) return;
    setPdfGenerating(true);
    pushToast('📄 Generando PDF...');
    // Quitamos temporalmente el límite de scroll para capturar la tabla completa
    const prevOverflow = scrollDiv.style.overflow, prevMaxHeight = scrollDiv.style.maxHeight, prevFlex = scrollDiv.style.flex;
    scrollDiv.style.overflow = 'visible'; scrollDiv.style.maxHeight = 'none'; scrollDiv.style.flex = 'none';
    await new Promise(r => setTimeout(r, 60));
    try {
      const canvas = await html2canvas(cardEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 5;
      const imgWidth = pageWidth - margin * 2;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      const imgData = canvas.toDataURL('image/png');
      let heightLeft = imgHeight, position = margin;
      pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - margin * 2);
      while (heightLeft > 0) {
        position = margin - (imgHeight - heightLeft);
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
        heightLeft -= (pageHeight - margin * 2);
      }
      pdf.save(`OBRAPLAN_Semana${weekNum}_${formatDateISO(singleWeekDates[0])}.pdf`);
      pushToast('✅ PDF descargado correctamente');
    } catch (e) {
      alert('No se pudo generar el PDF: ' + e.message);

                  const mimeType = isPdf ? 'application/pdf' : isImg ? `image/${ext === 'jpg' ? 'jpeg' : ext}` : 'application/octet-stream';
                  return (
                    <div key={i} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 12px',background:'#eff6ff',borderRadius:'10px',border:'1px solid #bfdbfe'}}>

                            const base64 = f.data.split(',')[1];

                            const bytes = new Uint8Array(binary.length);
                            for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
                            const blob = new Blob([bytes], { type: mimeType });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url; a.download = f.name; a.target = '_blank';
                            document.body.appendChild(a); a.click();
                            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
                          } catch(e) { alert('Error: ' + e.message); }

                  <button type="button" onClick={clearMonitorQuote} style={{padding:'8px 12px',borderRadius:'10px',border:'1px solid #e2e8f0',background:'white',color:'#64748b',fontSize:'11px',fontWeight:900,textTransform:'uppercase',cursor:'pointer'}}>Usar automática</button>
                </div>
                <p style={{fontSize:'10px',color:'#94a3b8',marginTop:'8px'}}>Si no escribes nada, el monitor mostrará una frase motivacional distinta cada día automáticamente. Las pantallas revisan este valor cada 5 minutos.</p>
              </div>
            )}
            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'16px'}}><button onClick={() => openUserForm(modalMode === 'techList' ? 'tech' : modalMode === 'monitorList' ? 'monitor' : 'admin')} className="btn-header" style={{background:'#2563eb',color:'white',border:'none'}}><Plus size={14} /> AÑADIR</button></div>
            <div style={{maxHeight:'400px',overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:'12px'}}>
              <table style={{width:'100%',textAlign:'left',fontSize:'12px',borderCollapse:'collapse'}}><tbody>
                {(modalMode === 'techList' ? techs : modalMode === 'monitorList' ? admins.filter(a => a.role === 'monitor') : admins.filter(a => a.role !== 'monitor')).map(u => (
                  <tr key={u.id} style={{borderBottom:'1px solid #f1f5f9'}}>
                    <td style={{padding:'10px',fontWeight:700,textTransform:'uppercase'}}>{u.name} {u.surname} <span style={{fontSize:'9px',color:'#94a3b8',marginLeft:'8px'}}>(@{u.username})</span></td>
                    <td style={{padding:'10px',textAlign:'right',display:'flex',gap:'4px',justifyContent:'flex-end'}}>
                        <button onClick={() => openUserForm(u.role, u)} style={{padding:'4px',color:'#94a3b8',background:'none',border:'none',cursor:'pointer',display:'inline-flex'}}><UserCog size={16} /></button>
                        <button onClick={() => handleDeleteUser(u)} style={{padding:'4px',color:'#94a3b8',background:'none',border:'none',cursor:'pointer',display:'inline-flex'}}><Trash2 size={16} /></button>
                      </td>
                  </tr>
                ))}
              </tbody></table>
            </div>
          </div>
        </Modal>
      )}

      {modalMode === 'userForm' && (
        <Modal onClose={closeModal} zIndex={60}>
          <div style={{padding:'24px'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',marginBottom:'16px'}}>Datos de Acceso</h3>
            <form onSubmit={handleCreateOrUpdateUser} style={{display:'flex',flexDirection:'column',gap:'12px'}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                <div><label className="label-form">Nombre</label><input required name="userName" defaultValue={editingUser?.name} className="input-form" style={{textTransform:'uppercase'}} /></div>
                <div><label className="label-form">Apellido</label><input required name="userSurname" defaultValue={editingUser?.surname} className="input-form" style={{textTransform:'uppercase'}} /></div>
              </div>
              <div><label className="label-form">Usuario</label><input required name="userUsername" defaultValue={editingUser?.username} className="input-form" /></div>
              <div><label className="label-form">Contraseña{editingUser ? ' (dejar en blanco para no cambiarla)' : ''}</label><input required={!editingUser} name="userPassword" type="password" placeholder={editingUser ? '••••••••' : ''} className="input-form" /></div>
              {userFormRole === 'tech' && (<div><label className="label-form">Jornada</label><select name="shiftType" defaultValue={editingUser?.shiftType || 'NORMAL'} className="input-form" style={{fontWeight:700}}><option value="NORMAL">NORMAL (Azul)</option><option value="INTENSIVA">INTENSIVA (Verde)</option></select></div>)}
              <div style={{display:'flex',gap:'8px',paddingTop:'8px'}}>
                <button type="button" onClick={closeModal} style={{flex:1,padding:'10px',fontSize:'11px',fontWeight:900,border:'1px solid #e2e8f0',borderRadius:'10px',cursor:'pointer',textTransform:'uppercase',background:'white'}}>CANCELAR</button>
                <button type="submit" disabled={saving} style={{flex:1,padding:'10px',fontSize:'11px',fontWeight:900,color:'white',background:'#2563eb',borderRadius:'10px',border:'none',cursor:'pointer',textTransform:'uppercase',opacity:saving?0.7:1}}>{saving ? '...' : 'GUARDAR'}</button>
              </div>
            </form>
          </div>
        </Modal>
      )}

      {modalMode === 'others' && (
        <Modal onClose={closeModal}>
          <div style={{padding:'16px',borderBottom:'1px solid #f1f5f9',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',margin:0}}>Registrar Ausencia</h3>
            <button onClick={closeModal} style={{padding:'4px',background:'none',border:'none',cursor:'pointer'}}><X size={20} /></button>
          </div>
          <form onSubmit={handleSaveAbsence} style={{padding:'20px',display:'flex',flexDirection:'column',gap:'16px'}}>
            <div><label className="label-form">Técnico</label><select required name="techId" className="input-form">{techs.map(t => <option key={t.id} value={t.id}>{t.name} {t.surname}</option>)}</select></div>
            <div><label className="label-form">Concepto</label><select required name="absenceType" className="input-form"><option value="BAJA">BAJA</option><option value="VACACIONES">VACACIONES</option><option value="PERMISO">PERMISO</option><option value="LIBRE POR HORAS">LIBRE POR HORAS</option></select></div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
              <div><label className="label-form">Inicio</label><input type="date" required name="startDate" className="input-form" /></div>
              <div><label className="label-form">Fin</label><input type="date" required name="endDate" className="input-form" /></div>
            </div>
            <div style={{display:'flex',gap:'16px',paddingTop:'8px'}}>
              <button type="button" onClick={closeModal} style={{flex:1,padding:'12px',borderRadius:'12px',border:'1px solid #e2e8f0',fontSize:'11px',fontWeight:900,textTransform:'uppercase',cursor:'pointer',background:'white'}}>CANCELAR</button>
              <button type="submit" disabled={saving} style={{flex:1,padding:'12px',borderRadius:'12px',background:'#f59e0b',color:'white',fontSize:'11px',fontWeight:900,textTransform:'uppercase',border:'none',cursor:'pointer',opacity:saving?0.7:1}}>CONFIRMAR</button>
            </div>
          </form>
        </Modal>
      )}

      {modalMode === 'printSelect' && (
        <Modal onClose={closeModal} maxWidth="380px">
          <div style={{padding:'16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',margin:0}}>Elegir técnicos a imprimir</h3>
            <button onClick={closeModal} style={{background:'none',border:'none',cursor:'pointer'}}><X size={18} /></button>
          </div>
          <div style={{padding:'16px'}}>
            <div style={{display:'flex',gap:'8px',marginBottom:'12px'}}>
              <button type="button" onClick={() => setPrintSelectedIds(displayedTechs.map(t => t.id))} style={{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid #e2e8f0',background:'white',fontSize:'10px',fontWeight:900,textTransform:'uppercase',cursor:'pointer',color:'#2563eb'}}>Marcar todos</button>
              <button type="button" onClick={() => setPrintSelectedIds([])} style={{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid #e2e8f0',background:'white',fontSize:'10px',fontWeight:900,textTransform:'uppercase',cursor:'pointer',color:'#dc2626'}}>Ninguno</button>
            </div>
            <div style={{maxHeight:'320px',overflowY:'auto',display:'flex',flexDirection:'column',gap:'4px',border:'1px solid #e2e8f0',borderRadius:'12px',padding:'8px'}}>
              {displayedTechs.map(t => {
                const checked = printSelectedIds.some(id => String(id) === String(t.id));
                return (
                  <div key={t.id} onClick={() => togglePrintTech(t.id)} style={{padding:'8px 10px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:700,display:'flex',alignItems:'center',gap:'8px',background:checked?'#eff6ff':'transparent',color:checked?'#1d4ed8':'#334155'}}>
                    <div style={{width:'14px',height:'14px',borderRadius:'4px',border:`2px solid ${checked?'#2563eb':'#cbd5e1'}`,background:checked?'#2563eb':'white',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      {checked && <CheckCircle2 size={9} color="white" />}
                    </div>
                    {t.name} {t.surname}
                  </div>
                );
              })}
            </div>
            <button onClick={confirmPrint} disabled={printSelectedIds.length === 0} style={{width:'100%',marginTop:'14px',padding:'12px',background:printSelectedIds.length===0?'#94a3b8':'#2563eb',color:'white',border:'none',borderRadius:'12px',fontWeight:900,fontSize:'11px',textTransform:'uppercase',cursor:printSelectedIds.length===0?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}><Printer size={14} /> Imprimir ({printSelectedIds.length})</button>
          </div>
        </Modal>
      )}

      {modalMode === 'bulkMove' && (
        <Modal onClose={closeModal} maxWidth="380px">
          <div style={{padding:'16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',margin:0}}>Mover {selectedIds.size} tarea{selectedIds.size !== 1 ? 's' : ''}</h3>
            <button onClick={closeModal} style={{background:'none',border:'none',cursor:'pointer'}}><X size={18} /></button>
          </div>
          <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:'12px'}}>
            <div>
              <label className="label-form">Técnico destino</label>
              <select className="input-form" value={bulkMoveTech} onChange={e => setBulkMoveTech(e.target.value)}>
                <option value="">Selecciona...</option>
                {techs.map(t => <option key={t.id} value={t.id}>{t.name} {t.surname}</option>)}
              </select>
            </div>
            <div>
              <label className="label-form">Día destino</label>
              <select className="input-form" value={bulkMoveDate} onChange={e => setBulkMoveDate(e.target.value)}>
                <option value="">Selecciona...</option>
                {singleWeekDates.map((d, i) => { const iso = formatDateISO(d); return <option key={iso} value={iso}>{DAYS_NAMES[i]} {d.getDate()}</option>; })}
              </select>
            </div>
            <button onClick={confirmBulkMove} style={{padding:'12px',background:'#2563eb',color:'white',border:'none',borderRadius:'12px',fontWeight:900,fontSize:'11px',textTransform:'uppercase',cursor:'pointer'}}>Mover</button>
          </div>
        </Modal>
      )}

      {modalMode === 'audit' && (
        <Modal onClose={closeModal} maxWidth="560px">
          <div style={{padding:'16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',margin:0}}>Historial de Cambios</h3>
            <button onClick={closeModal} style={{background:'none',border:'none',cursor:'pointer'}}><X size={18} /></button>
          </div>
          <div style={{padding:'16px',maxHeight:'440px',overflowY:'auto'}}>
            {auditLoading && <p style={{fontSize:'11px',color:'#94a3b8',textAlign:'center',padding:'16px'}}>Cargando...</p>}
            {!auditLoading && auditLog.length === 0 && (
              <p style={{fontSize:'11px',color:'#94a3b8',textAlign:'center',padding:'16px',lineHeight:1.6}}>
                No hay registros disponibles todavía.<br/>Si es la primera vez, es posible que falte crear la tabla <code>audit_log</code> en Supabase (consulta las instrucciones que te he dado).
              </p>
            )}
            {!auditLoading && auditLog.map((a, i) => (
              <div key={i} style={{display:'flex',flexDirection:'column',gap:'2px',padding:'8px 12px',borderBottom:'1px solid #f1f5f9'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontWeight:900,fontSize:'11px',color:'#1e293b',textTransform:'uppercase'}}>{a.actor}</span>
                  <span style={{fontSize:'9px',color:'#94a3b8',fontWeight:700}}>{new Date(a.created_at).toLocaleString('es-ES')}</span>
                </div>
                <div style={{fontSize:'10px',color:'#475569'}}><strong style={{color:'#2563eb'}}>{a.action}</strong> — {a.detail}</div>
              </div>
            ))}
          </div>
        </Modal>
      )}

      {modalMode === 'reorder' && (
        <Modal onClose={closeModal} maxWidth="400px">
          <div style={{padding:'16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',margin:0}}>Ordenar Técnicos</h3>
            <button onClick={closeModal} style={{background:'none',border:'none',cursor:'pointer'}}><X size={18} /></button>
          </div>
          <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:'8px'}}>
            <p style={{fontSize:'11px',color:'#64748b',fontWeight:700}}>Arrastra para reordenar. El orden se guardará para todos.</p>
            <div style={{display:'flex',flexDirection:'column',gap:'6px',maxHeight:'400px',overflowY:'auto'}}>
              {reorderList.map((t, idx) => (
                <div key={t.id} draggable
                  onDragStart={() => handleDragStart(idx)}
                  onDragOver={(e) => handleDragOver(e, idx)}
                  onDragEnd={handleDragEnd}
                  style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',background:dragIdx===idx?'#eff6ff':'#f8fafc',border:'1px solid',borderColor:dragIdx===idx?'#93c5fd':'#e2e8f0',borderRadius:'10px',cursor:'grab',userSelect:'none'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:'2px',color:'#94a3b8'}}>
                    <div style={{width:'16px',height:'2px',background:'currentColor',borderRadius:'1px'}}/>
                    <div style={{width:'16px',height:'2px',background:'currentColor',borderRadius:'1px'}}/>
                    <div style={{width:'16px',height:'2px',background:'currentColor',borderRadius:'1px'}}/>
                  </div>
                  <div style={{width:'8px',height:'8px',borderRadius:'50%',background:t.shiftType==='INTENSIVA'?'#22c55e':'#3b82f6',flexShrink:0}} />
                  <div>
                    <div style={{fontWeight:900,fontSize:'13px',color:'#1e293b',textTransform:'uppercase'}}>{t.name} {t.surname}</div>
                    <div style={{fontSize:'10px',color:'#94a3b8',textTransform:'uppercase'}}>{t.shiftType}</div>
                  </div>
                  <div style={{marginLeft:'auto',fontSize:'11px',fontWeight:900,color:'#cbd5e1'}}>#{idx+1}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:'8px',paddingTop:'8px'}}>
              <button onClick={closeModal} style={{flex:1,padding:'10px',fontSize:'11px',fontWeight:900,border:'1px solid #e2e8f0',borderRadius:'10px',cursor:'pointer',textTransform:'uppercase',background:'white'}}>CANCELAR</button>
              <button onClick={saveReorder} disabled={saving} style={{flex:1,padding:'10px',fontSize:'11px',fontWeight:900,color:'white',background:'#2563eb',borderRadius:'10px',border:'none',cursor:'pointer',textTransform:'uppercase',opacity:saving?0.7:1}}>GUARDAR ORDEN</button>
            </div>
          </div>
        </Modal>
      )}

      {modalMode === 'holiday' && (
        <Modal onClose={closeModal} maxWidth="380px">
          <div style={{padding:'20px',borderBottom:'1px solid #e2e8f0',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',textAlign:'center'}}>FESTIVOS</h3>
          </div>
          <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:'12px'}}>
            {holidays.length > 0 && (
              <div style={{maxHeight:'200px',overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:'12px'}}>
                {[...holidays].sort().map(h => (
                  <div key={h} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',borderBottom:'1px solid #f1f5f9'}}>
                    <span style={{fontWeight:700,fontSize:'12px',color:'#1e293b'}}>{h}</span>
                    <button onClick={() => handleDeleteHoliday(h)} style={{padding:'4px',background:'none',border:'none',cursor:'pointer',color:'#ef4444',display:'flex'}}><Trash2 size={14} /></button>
                  </div>
                ))}
              </div>
            )}
            <form onSubmit={handleAddHoliday} style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              <label className="label-form">Añadir nuevo festivo</label>
              <input type="date" name="holidayDate" required className="input-form" />
              <div style={{display:'flex',gap:'8px'}}>
                <button type="button" onClick={closeModal} style={{flex:1,padding:'8px',fontSize:'10px',fontWeight:900,border:'1px solid #e2e8f0',borderRadius:'10px',cursor:'pointer',textTransform:'uppercase',background:'white'}}>CERRAR</button>
                <button type="submit" style={{flex:1,padding:'8px',fontSize:'10px',fontWeight:900,background:'#dc2626',color:'white',borderRadius:'10px',border:'none',cursor:'pointer',textTransform:'uppercase'}}>AÑADIR</button>
              </div>
            </form>
          </div>
        </Modal>
      )}

      {/* ─── FOOTER WARNINGS ─── */}
      { (() => {
        // Warning: techs with at least one day without any task or absence
        const pendingTechs = visibleTechs.filter(t => {
          return singleWeekDates.some(date => {
            const dISO = formatDateISO(date);
            const dayNum = date.getDay();
            if (dayNum === 0 || dayNum === 6) return false;
            const hasSomething = tasks.some(tk => tk.techIds.includes(t.id) && tk.date === dISO);
            return !hasSomething;
          });
        });

        if (pendingTechs.length === 0) return null;
        return (
          <div className="no-print" style={{maxWidth:'1800px',margin:'6px auto 0',display:'flex',flexDirection:'column',gap:'4px',padding:'0 16px 8px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',padding:'4px 12px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'8px',fontSize:'10px',fontWeight:700,color:'#dc2626'}}>
              <span style={{fontSize:'13px'}}>⚠️</span>
              <span><strong>{pendingTechs.length} técnico{pendingTechs.length > 1 ? 's' : ''}</strong> con días sin tarea asignada esta semana{pendingTechs.length <= 5 ? <>: <strong>{pendingTechs.map(t => t.name).join(', ')}</strong></> : ''}</span>
            </div>
          </div>
        );
      })() }

    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
