// --- Compresión de imágenes adjuntas (reduce tamaño en Supabase) ---
// Redimensiona a un máximo de 1600px de lado y recomprime como JPEG de calidad 0.75.
// PDFs, Word, Excel, etc. se guardan tal cual, sin tocar.
const MAX_IMG_DIMENSION = 1600;
const IMG_JPEG_QUALITY = 0.75;
const compressImageFile = (file) => new Promise((resolve) => {
  const ext = file.name.split('.').pop()?.toLowerCase();
  const isCompressible = ['jpg','jpeg','png','webp'].includes(ext);
  if (!isCompressible) { resolve(null); return; } // null = no comprimir, usar original
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > MAX_IMG_DIMENSION || height > MAX_IMG_DIMENSION) {
        if (width > height) { height = Math.round(height * (MAX_IMG_DIMENSION / width)); width = MAX_IMG_DIMENSION; }
        else { width = Math.round(width * (MAX_IMG_DIMENSION / height)); height = MAX_IMG_DIMENSION; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      try {
        const dataUrl = canvas.toDataURL('image/jpeg', IMG_JPEG_QUALITY);
        resolve(dataUrl);
      } catch(e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = ev.target.result;
  };
  reader.onerror = () => resolve(null);
  reader.readAsDataURL(file);
});

// --- Seguridad: hash de contraseñas (SHA-256 + salt del propio usuario) ---
// No sustituye a un backend real, pero evita que las contraseñas viajen y se
// guarden en texto plano en Supabase. Compatible con cuentas antiguas: si el
// hash no coincide, comprueba si coincide en texto plano y migra al vuelo.
const hashPassword = async (username, plainPassword) => {
  const enc = new TextEncoder();
  const data = enc.encode(`obraplan_salt::${username.toLowerCase()}::${plainPassword}`);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
};

const getWeekNumber = (d) => { const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dayNum = date.getUTCDay() || 7; date.setUTCDate(date.getUTCDate() + 4 - dayNum); const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1)); return Math.ceil((((date - yearStart) / 86400000) + 1) / 7); };
const getMonday = (d) => { const date = new Date(d); const day = date.getDay(); const diff = date.getDate() - day + (day === 0 ? -6 : 1); return new Date(date.setDate(diff)); };

const formatDateISO = (date) => {
  if (!date) return "";
  try {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  } catch(e) { return ""; }
};

function TaskCard({ task, highlight, isAdmin, onView, onToggle, onEdit, onCopy, onDelete }) {
  const [hover, setHover] = useState(false);
  const bg = highlight ? '#ccff00' : task.isAbsence ? '#fef3c7' : task.completed ? '#dcfce7' : 'white';
  const border = highlight ? '#99cc00' : task.isAbsence ? '#fcd34d' : task.completed ? '#86efac' : '#bfdbfe';
  const tooltipParts = [];
  if (task.instructions) tooltipParts.push(`📋 ${task.instructions.slice(0,140)}${task.instructions.length>140?'…':''}`);
  if (task.files?.length) tooltipParts.push(`📎 ${task.files.length} archivo(s) adjunto(s)`);
  if (task.hours) tooltipParts.push(`⏱ ${task.hours}h estimadas`);
  tooltipParts.push(task.completed ? '✅ Completado' : '⏳ Pendiente');
  const tooltip = tooltipParts.join('\n');
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} onClick={onView} title={tooltip}
      className="task-card" style={{background:bg,border:`1.5px solid ${border}`,borderRadius:'6px',padding:'4px 6px',position:'relative',cursor:'pointer'}}>
      {hover && (
        <div onClick={e => e.stopPropagation()} style={{position:'absolute',top:'2px',right:'2px',display:'flex',gap:'2px',background:'rgba(255,255,255,0.97)',borderRadius:'4px',padding:'2px',boxShadow:'0 1px 4px rgba(0,0,0,0.15)',zIndex:20}}>

          {isAdmin && !task.isAbsence && <button onClick={onEdit} style={{padding:'2px',background:'none',border:'none',cursor:'pointer',color:'#94a3b8',display:'flex'}}><Pencil size={11} /></button>}
          {isAdmin && !task.isAbsence && <button onClick={onCopy} style={{padding:'2px',background:'none',border:'none',cursor:'pointer',color:'#94a3b8',display:'flex'}}><Copy size={11} /></button>}

              })
            )}
          </CellHover>
        );
      })}
    </tr>
  );
}

  const [pendingFiles, setPendingFiles] = useState([]);
  const [repeatEnabled, setRepeatEnabled] = useState(false);
  const [repeatFreq, setRepeatFreq] = useState('weekly');
  const [repeatCount, setRepeatCount] = useState(4);
  const [taskComments, setTaskComments] = useState([]);
  const [commentsLoading, setCommentsLoading] = useState(false);
  const [newComment, setNewComment] = useState("");
  const [auditLog, setAuditLog] = useState([]);
  const [auditLoading, setAuditLoading] = useState(false);
  const [darkMode, setDarkMode] = useState(() => localStorage.getItem('obraplan_dark') === '1');
  const [toasts, setToasts] = useState([]);
  const [offline, setOffline] = useState(false);
  const skipNextToastRef = React.useRef(false);
  const firstLoadRef = React.useRef(true);

  const isAdmin = useMemo(() => user?.role === 'admin', [user]);
  const isMonitor = useMemo(() => user?.role === 'monitor', [user]);
  const monitorScrollRef = React.useRef(null);
  const [monitorClock, setMonitorClock] = useState(new Date());
  const [monitorTheme, setMonitorTheme] = useState('night'); // 'day' | 'night' — efectivo para esta pantalla
  const [monitorThemeDefault, setMonitorThemeDefault] = useState('night'); // preferencia global guardada por el admin
  const [monitorQuoteOverride, setMonitorQuoteOverride] = useState('');
  const [adminQuoteDraft, setAdminQuoteDraft] = useState('');
  const [monitorLoop, setMonitorLoop] = useState(false);

  // Reloj visible en la pantalla del monitor (actualización fluida cada segundo)
  useEffect(() => {
    if (!isMonitor) return;
    const iv = setInterval(() => setMonitorClock(new Date()), 1000);
    return () => clearInterval(iv);
  }, [isMonitor]);

  // El monitor siempre muestra la semana actual: revisa cada 5 min si ha cambiado
  useEffect(() => {
    if (!isMonitor) return;
    const iv = setInterval(() => {
      const realMonday = getMonday(new Date());
      setCurrentMonday(prev => formatDateISO(prev) !== formatDateISO(realMonday) ? realMonday : prev);
    }, 5 * 60000);
    return () => clearInterval(iv);
  }, [isMonitor]);

  // Refresco de datos cada 10s por si hay cambios (además del tiempo real de Supabase)
  // (se registra más abajo, después de declarar loadAll)

  // Tema día/noche: preferencia global del admin (Supabase) + posible override local de esta pantalla
  useEffect(() => {
    if (!isMonitor) return;
    (async () => {
      const { data } = await sb.from('app_settings').select('*').eq('key', 'monitor_theme').maybeSingle();
      const globalDefault = data?.value === 'day' ? 'day' : 'night';
      setMonitorThemeDefault(globalDefault);
      const override = localStorage.getItem('obraplan_monitor_theme_override');
      setMonitorTheme(override === 'day' || override === 'night' ? override : globalDefault);
    })();
  }, [isMonitor]);

  const toggleMonitorTheme = () => {
    const next = monitorTheme === 'day' ? 'night' : 'day';
    setMonitorTheme(next);
    localStorage.setItem('obraplan_monitor_theme_override', next);
  };

  // Frase motivacional: la fija el admin (se revisa cada 5 min por si la cambia)
  useEffect(() => {
    if (!isMonitor) return;
    const fetchQuote = async () => {
      const { data } = await sb.from('app_settings').select('*').eq('key', 'monitor_quote_custom').maybeSingle();
      setMonitorQuoteOverride(data?.value || '');
    };
    fetchQuote();
    const iv = setInterval(fetchQuote, 5 * 60000);
    return () => clearInterval(iv);
  }, [isMonitor]);


  // Determina si hace falta bucle de scroll (el contenido no cabe en pantalla)
  useEffect(() => {
    if (!isMonitor) return;
    const check = () => {
      const el = monitorScrollRef.current;
      if (!el) return;
      const singleHeight = monitorLoop ? el.scrollHeight / 2 : el.scrollHeight;
      const needsLoop = singleHeight > el.clientHeight + 2;
      setMonitorLoop(prev => prev !== needsLoop ? needsLoop : prev);
    };
    const t = setTimeout(check, 150);
    return () => clearTimeout(t);
  }, [isMonitor, visibleTechs, tasks, monitorTheme, monitorLoop]);

  // Auto-scroll vertical realmente continuo: las filas se duplican y al pasar la
  // altura de una "vuelta" se resta esa misma altura de golpe, con lo que el
  // salto es imperceptible (el contenido que aparece es idéntico al anterior).
  useEffect(() => {
    if (!isMonitor || !monitorLoop) return;
    const SPEED = 0.805; // 0.7 + 15%
    const iv = setInterval(() => {
      const el = monitorScrollRef.current;
      if (!el) return;
      const singleHeight = el.scrollHeight / 2;
      if (singleHeight <= 2) return;
      el.scrollTop += SPEED;
      if (el.scrollTop >= singleHeight) el.scrollTop -= singleHeight;
    }, 33);
    return () => clearInterval(iv);
  }, [isMonitor, monitorLoop]);

  const pushToast = useCallback((msg, type = 'info') => {
    const id = newId();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
  }, []);

  useEffect(() => {
    document.body.classList.toggle('dark-mode', darkMode);
    localStorage.setItem('obraplan_dark', darkMode ? '1' : '0');
  }, [darkMode]);

  const loadAll = useCallback(async (isBackground = false) => {
    if (!isBackground) setLoading(true);
    try {
      const [{ data: td, error: e1 }, { data: ad, error: e2 }, { data: hd, error: e3 }, { data: tkd, error: e4 }] = await Promise.all([
        sb.from('techs').select('*').order('sort_order', { ascending: true }).order('id'),
        sb.from('admins').select('*').order('id'),
        sb.from('holidays').select('*'),
        sb.from('tasks').select('*'),
      ]);
      if (e1 || e2 || e3 || e4) throw (e1 || e2 || e3 || e4);
      const newTechs = (td || []).map(dbTechToLocal);
      const newAdmins = ad || [];
      const newHolidays = (hd || []).map(h => h.date);
      const newTasks = (tkd || []).map(dbTaskToLocal);
      setTechs(newTechs); setAdmins(newAdmins); setHolidays(newHolidays); setTasks(newTasks);
      setOffline(false);
      try { localStorage.setItem('obraplan_cache', JSON.stringify({ techs: newTechs, admins: newAdmins, holidays: newHolidays, tasks: newTasks, savedAt: Date.now() })); } catch(e) {}
    } catch(e) {
      console.error(e);
      // Sin conexión: intentar cargar la última copia guardada localmente
      try {
        const cached = JSON.parse(localStorage.getItem('obraplan_cache') || 'null');
        if (cached) {
          setTechs(cached.techs || []); setAdmins(cached.admins || []);
          setHolidays(cached.holidays || []); setTasks(cached.tasks || []);
          setOffline(true);
        }

      const found = list.find(a => a.username === u);
      if (!found) return null;
      if (found.password === hashedInput) return found; // ya migrado
      if (!looksHashed(found.password) && found.password === p) {
        // Cuenta antigua en texto plano: coincide -> migrar silenciosamente a hash
        await sb.from(table).update({ password: hashedInput }).eq('id', found.id);
        return { ...found, password: hashedInput };
      }
      return null;
    };
    const fa = await tryMatch(admins, 'admins');
    if (fa) { setUser(fa); setLoginError(""); return; }

  const handleSaveTask = async (e) => {
    e.preventDefault();
    // Aviso si el ID ya existe con otro cliente/referencia (posible error de tecleo o colisión)
    if (!editingTask) {
      const mismatch = tasks.find(t => !t.isAbsence && t.id === formTaskId && (t.customer !== formCustomer || t.reference !== formReference));
      if (mismatch) {
        const proceed = window.confirm(`⚠️ El ID "${formTaskId}" ya existe con datos distintos:\n\nCliente: ${mismatch.customer}\nReferencia: ${mismatch.reference}\n\n¿Seguro que quieres guardar esta tarea con el mismo ID pero datos diferentes?`);

    const instructions = e.target.instructions ? e.target.instructions.value : '';

    // Start with existing files, then add newly picked ones
    let files = editingTask?.files ? [...editingTask.files] : [];
    if (pendingFiles.length > 0) {
      const newFileObjs = await Promise.all(pendingFiles.map(async f => {
        const compressed = await compressImageFile(f);
        if (compressed) return { name: f.name.replace(/\.(png|webp)$/i, '.jpg'), data: compressed };
        // No es imagen comprimible (PDF, Word, etc.): guardar tal cual
        return new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = ev => resolve({ name: f.name, data: ev.target.result });
          reader.readAsDataURL(f);
        });
      }));
      files = [...files, ...newFileObjs];
    }
    const taskData = { internalId: editingTask?.internalId || newId(), id: formTaskId, customer: formCustomer, reference: formReference, instructions, date: selectedSlot.dateISO, techIds: tempAssignedTechs, completed: editingTask?.completed || false, isAbsence: false, files, hours: hoursVal };

    if (editingTask) {
      const r = await sb.from('tasks').update(localTaskToDB(taskData)).eq('internal_id', editingTask.internalId); err = r.error;
    } else if (repeatEnabled && repeatCount > 0) {
      // Generar ocurrencias adicionales según la frecuencia elegida
      const occurrences = [taskData];
      const baseDate = new Date(selectedSlot.dateISO + 'T12:00:00');
      for (let i = 1; i <= repeatCount; i++) {
        const d = new Date(baseDate);
        if (repeatFreq === 'weekly') d.setDate(d.getDate() + 7 * i);
        else if (repeatFreq === 'biweekly') d.setDate(d.getDate() + 14 * i);
        else if (repeatFreq === 'monthly') d.setMonth(d.getMonth() + i);
        const dISO = formatDateISO(d);
        // No crear en días donde algún técnico asignado ya tenga una ausencia
        const blocked = tempAssignedTechs.some(tid => tasks.some(x => x.techIds.includes(tid) && x.date === dISO && x.isAbsence));
        if (!blocked) occurrences.push({ ...taskData, internalId: newId() + i, date: dISO, completed: false });
      }
      const r = await sb.from('tasks').insert(occurrences.map(localTaskToDB)); err = r.error;
      if (!err) pushToast(`✅ ${occurrences.length} tareas creadas (recurrente)`);
    } else {
      const r = await sb.from('tasks').insert(localTaskToDB(taskData)); err = r.error;
    }
    setSaving(false);
    if (err) { alert('Error al guardar tarea: ' + err.message); return; }
    logAudit(sb, user, editingTask ? 'EDITAR_TAREA' : 'CREAR_TAREA', `${taskData.id} - ${taskData.customer}${repeatEnabled && !editingTask ? ' (recurrente)' : ''}`);

          <button type="submit" style={{width:'100%',background:'#2563eb',color:'white',fontWeight:900,padding:'14px',borderRadius:'16px',border:'none',cursor:'pointer',fontSize:'12px',textTransform:'uppercase',letterSpacing:'2px',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>Entrar <LogIn size={16} color="white" /></button>

              const dISO = formatDateISO(date);

              return (
                <div key={dIdx} style={{background:'white',borderRadius:'16px',border:`2px solid ${isH?'#fca5a5':'#cbd5e1'}`,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>

                  const icon = isPdf ? '📄' : isImg ? '🖼️' : ext === 'xlsx' || ext === 'xls' ? '📊' : ext === 'docx' || ext === 'doc' ? '📝' : '📎';

                            const blob = new Blob([bytes], { type: mimeType });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url; a.download = f.name; a.target = '_blank';
                            document.body.appendChild(a); a.click();

          </div>
          <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:'8px',maxHeight:'420px',overflowY:'auto'}}>
            {hoursReport.length === 0 && <p style={{fontSize:'11px',color:'#94a3b8',textAlign:'center',padding:'16px'}}>Sin datos para esta semana.</p>}
            {hoursReport.map((r, i) => (
              <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:'#f8fafc',borderRadius:'10px',border:'1px solid #e2e8f0'}}>
                <div>
                  <div style={{fontWeight:900,fontSize:'12px',color:'#1e293b',textTransform:'uppercase'}}>{r.name}</div>
                  <div style={{fontSize:'10px',color:'#94a3b8',fontWeight:700}}>{r.count} tarea{r.count !== 1 ? 's' : ''}{r.withoutHours > 0 ? ` · ${r.withoutHours} sin horas` : ''}</div>
                </div>
                <div style={{fontWeight:900,fontSize:'16px',color:'#0891b2'}}>{r.total}h</div>
              </div>
            ))}
            {hoursReport.length > 0 && (
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',marginTop:'4px',borderTop:'2px solid #e2e8f0'}}>
                <span style={{fontWeight:900,fontSize:'11px',color:'#475569',textTransform:'uppercase'}}>Total semana</span>
                <span style={{fontWeight:900,fontSize:'18px',color:'#1e293b'}}>{hoursReport.reduce((s,r) => s+r.total,0)}h</span>
              </div>
            )}
          </div>
        </Modal>
      )}

      {modalMode === 'audit' && (
        <Modal onClose={closeModal} maxWidth="560px">
          <div style={{padding:'16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',margin:0}}>Historial de Cambios</h3>
            <button onClick={closeModal} style={{background:'none',border:'none',cursor:'pointer'}}><X size={18} /></button>
          </div>
          <div style={{padding:'16px',maxHeight:'440px',overflowY:'auto'}}>
            {auditLoading && <p style={{fontSize:'11px',color:'#94a3b8',textAlign:'center',padding:'16px'}}>Cargando...</p>}
            {!auditLoading && auditLog.length === 0 && (
              <p style={{fontSize:'11px',color:'#94a3b8',textAlign:'center',padding:'16px',lineHeight:1.6}}>
                No hay registros disponibles todavía.<br/>Si es la primera vez, es posible que falte crear la tabla <code>audit_log</code> en Supabase (consulta las instrucciones que te he dado).
              </p>
            )}
            {!auditLoading && auditLog.map((a, i) => (
              <div key={i} style={{display:'flex',flexDirection:'column',gap:'2px',padding:'8px 12px',borderBottom:'1px solid #f1f5f9'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontWeight:900,fontSize:'11px',color:'#1e293b',textTransform:'uppercase'}}>{a.actor}</span>
                  <span style={{fontSize:'9px',color:'#94a3b8',fontWeight:700}}>{new Date(a.created_at).toLocaleString('es-ES')}</span>
                </div>
                <div style={{fontSize:'10px',color:'#475569'}}><strong style={{color:'#2563eb'}}>{a.action}</strong> — {a.detail}</div>
              </div>
            ))}
          </div>
        </Modal>
      )}

      {modalMode === 'reorder' && (
        <Modal onClose={closeModal} maxWidth="400px">
          <div style={{padding:'16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',margin:0}}>Ordenar Técnicos</h3>
            <button onClick={closeModal} style={{background:'none',border:'none',cursor:'pointer'}}><X size={18} /></button>
          </div>
          <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:'8px'}}>
            <p style={{fontSize:'11px',color:'#64748b',fontWeight:700}}>Arrastra para reordenar. El orden se guardará para todos.</p>
            <div style={{display:'flex',flexDirection:'column',gap:'6px',maxHeight:'400px',overflowY:'auto'}}>
              {reorderList.map((t, idx) => (
                <div key={t.id} draggable
                  onDragStart={() => handleDragStart(idx)}
                  onDragOver={(e) => handleDragOver(e, idx)}
                  onDragEnd={handleDragEnd}
                  style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',background:dragIdx===idx?'#eff6ff':'#f8fafc',border:'1px solid',borderColor:dragIdx===idx?'#93c5fd':'#e2e8f0',borderRadius:'10px',cursor:'grab',userSelect:'none'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:'2px',color:'#94a3b8'}}>
                    <div style={{width:'16px',height:'2px',background:'currentColor',borderRadius:'1px'}}/>
                    <div style={{width:'16px',height:'2px',background:'currentColor',borderRadius:'1px'}}/>
                    <div style={{width:'16px',height:'2px',background:'currentColor',borderRadius:'1px'}}/>
                  </div>
                  <div style={{width:'8px',height:'8px',borderRadius:'50%',background:t.shiftType==='INTENSIVA'?'#22c55e':'#3b82f6',flexShrink:0}} />
                  <div>
                    <div style={{fontWeight:900,fontSize:'13px',color:'#1e293b',textTransform:'uppercase'}}>{t.name} {t.surname}</div>
                    <div style={{fontSize:'10px',color:'#94a3b8',textTransform:'uppercase'}}>{t.shiftType}</div>
                  </div>
                  <div style={{marginLeft:'auto',fontSize:'11px',fontWeight:900,color:'#cbd5e1'}}>#{idx+1}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:'8px',paddingTop:'8px'}}>
              <button onClick={closeModal} style={{flex:1,padding:'10px',fontSize:'11px',fontWeight:900,border:'1px solid #e2e8f0',borderRadius:'10px',cursor:'pointer',textTransform:'uppercase',background:'white'}}>CANCELAR</button>
              <button onClick={saveReorder} disabled={saving} style={{flex:1,padding:'10px',fontSize:'11px',fontWeight:900,color:'white',background:'#2563eb',borderRadius:'10px',border:'none',cursor:'pointer',textTransform:'uppercase',opacity:saving?0.7:1}}>GUARDAR ORDEN</button>
            </div>
          </div>
        </Modal>
      )}

      {modalMode === 'holiday' && (
        <Modal onClose={closeModal} maxWidth="380px">
          <div style={{padding:'20px',borderBottom:'1px solid #e2e8f0',background:'#f8fafc'}}>
            <h3 style={{fontWeight:900,color:'#1e293b',textTransform:'uppercase',letterSpacing:'2px',fontSize:'12px',textAlign:'center'}}>FESTIVOS</h3>
          </div>
          <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:'12px'}}>
            {holidays.length > 0 && (
              <div style={{maxHeight:'200px',overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:'12px'}}>
                {[...holidays].sort().map(h => (
                  <div key={h} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',borderBottom:'1px solid #f1f5f9'}}>
                    <span style={{fontWeight:700,fontSize:'12px',color:'#1e293b'}}>{h}</span>
                    <button onClick={() => handleDeleteHoliday(h)} style={{padding:'4px',background:'none',border:'none',cursor:'pointer',color:'#ef4444',display:'flex'}}><Trash2 size={14} /></button>
                  </div>
                ))}
              </div>
            )}
            <form onSubmit={handleAddHoliday} style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              <label className="label-form">Añadir nuevo festivo</label>
              <input type="date" name="holidayDate" required className="input-form" />
              <div style={{display:'flex',gap:'8px'}}>
                <button type="button" onClick={closeModal} style={{flex:1,padding:'8px',fontSize:'10px',fontWeight:900,border:'1px solid #e2e8f0',borderRadius:'10px',cursor:'pointer',textTransform:'uppercase',background:'white'}}>CERRAR</button>
                <button type="submit" style={{flex:1,padding:'8px',fontSize:'10px',fontWeight:900,background:'#dc2626',color:'white',borderRadius:'10px',border:'none',cursor:'pointer',textTransform:'uppercase'}}>AÑADIR</button>
              </div>
            </form>
          </div>
        </Modal>
      )}

      {/* ─── FOOTER WARNINGS ─── */}
      { (() => {
        // Warning 1: techs with >3 tasks on same day
        const overloadWarnings = [];
        weekDates.forEach(date => {
          const dISO = formatDateISO(date);
          visibleTechs.forEach(t => {
            const count = tasks.filter(tk => tk.techIds.includes(t.id) && tk.date === dISO && !tk.isAbsence).length;
            if (count >= 3) overloadWarnings.push({ name: `${t.name} ${t.surname}`, day: DAYS_NAMES[weekDates.indexOf(date)], count });
          });
        });

        // Warning 2: removed (shift mismatch)

        // Warning 3: techs with at least one day without any task or absence
        const pendingTechs = visibleTechs.filter(t => {
          return weekDates.some(date => {
            const dISO = formatDateISO(date);
            const dayNum = date.getDay();
            if (dayNum === 0 || dayNum === 6) return false;
            const hasSomething = tasks.some(tk => tk.techIds.includes(t.id) && tk.date === dISO);
            return !hasSomething;
          });
        });

        const hasWarnings = overloadWarnings.length > 0 || pendingTechs.length > 0;
        if (!hasWarnings) return null;
        return (
          <div className="no-print" style={{maxWidth:'1800px',margin:'12px auto 0',display:'flex',flexDirection:'column',gap:'6px',padding:'0 16px 16px'}}>
            {overloadWarnings.map((w, i) => (
              <div key={i} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 14px',background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:'10px',fontSize:'11px',fontWeight:700,color:'#c2410c'}}>
                <span style={{fontSize:'16px'}}>⚠️</span>
                <span><strong>{w.name}</strong> tiene <strong>{w.count} tareas</strong> el <strong>{w.day}</strong> — más de 3 tareas en un día</span>
              </div>
            ))}

            {pendingTechs.length > 0 && (
              <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 14px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'10px',fontSize:'11px',fontWeight:700,color:'#dc2626'}}>
                <span style={{fontSize:'16px'}}>⚠️</span>
                <span><strong>{pendingTechs.length} técnico{pendingTechs.length > 1 ? 's' : ''}</strong> con días sin tarea asignada esta semana: <strong>{pendingTechs.map(t => t.name).join(', ')}</strong></span>
              </div>
            )}
          </div>
        );
      })() }

    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
